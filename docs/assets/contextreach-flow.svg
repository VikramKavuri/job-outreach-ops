<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ContextReach execution path</title>
  <desc id="desc">A complete job row passes through an intake gate, contact discovery, evidence-grounded drafting, and human review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#818cf8"/>
      <stop offset="0.78" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <style>
      .title{font:700 30px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle;letter-spacing:-.02em}
      .eyebrow{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7dd3fc;text-anchor:middle;letter-spacing:.18em}
      .node-title{font:650 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc;text-anchor:middle}
      .node-copy{font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8;text-anchor:middle;letter-spacing:.04em}
      .step{font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#64748b;text-anchor:middle;letter-spacing:.12em}
      .card{fill:#0b1224;stroke:#334155;stroke-width:1.25}
      .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
      @keyframes pulse{0%,100%{opacity:.82;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}.packet{display:none}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="208" rx="520" ry="210" fill="url(#halo)" opacity=".5"/>

  <text x="600" y="52" class="eyebrow">CONTEXTREACH</text>
  <text x="600" y="91" class="title">Complete context in. Reviewable outreach out.</text>

  <path id="motionRoute" d="M142 225 H1058" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M142 225 H1058" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 13" opacity=".24"/>

  <g class="pulse">
    <text x="142" y="151" class="step">01</text>
    <rect class="card" x="62" y="168" width="160" height="114" rx="16"/>
    <circle cx="142" cy="197" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <text x="142" y="236" class="node-title">Job row</text>
    <text x="142" y="257" class="node-copy">5 REQUIRED FIELDS</text>
  </g>

  <g class="pulse d1">
    <text x="371" y="151" class="step">02</text>
    <rect class="card" x="291" y="168" width="160" height="114" rx="16"/>
    <circle cx="371" cy="197" r="8" fill="#60a5fa" filter="url(#glow)"/>
    <text x="371" y="236" class="node-title">Intake gate</text>
    <text x="371" y="257" class="node-copy">READY + STATUS BLANK</text>
  </g>

  <g class="pulse d2">
    <text x="600" y="151" class="step">03</text>
    <rect class="card" x="520" y="168" width="160" height="114" rx="16"/>
    <circle cx="600" cy="197" r="8" fill="#818cf8" filter="url(#glow)"/>
    <text x="600" y="236" class="node-title">Contact graph</text>
    <text x="600" y="257" class="node-copy">SEARCH · RANK · ENRICH</text>
  </g>

  <g class="pulse d3">
    <text x="829" y="151" class="step">04</text>
    <rect class="card" x="749" y="168" width="160" height="114" rx="16"/>
    <circle cx="829" cy="197" r="8" fill="#c084fc" filter="url(#glow)"/>
    <text x="829" y="236" class="node-title">Evidence drafts</text>
    <text x="829" y="257" class="node-copy">RECRUITER · MANAGER · PEER</text>
  </g>

  <g class="pulse d4">
    <text x="1058" y="151" class="step">05</text>
    <rect x="978" y="168" width="160" height="114" rx="16" fill="#071a15" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="1058" cy="197" r="8" fill="#4ade80" filter="url(#glow)"/>
    <text x="1058" y="236" class="node-title">Human review</text>
    <text x="1058" y="257" class="node-copy">GMAIL DRAFTS ONLY</text>
  </g>

  <g class="packet" filter="url(#glow)">
    <circle r="5" fill="#fff">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#motionRoute"/></animateMotion>
    </circle>
    <circle r="3" fill="#bae6fd" opacity=".9">
      <animateMotion dur="5.5s" begin="-2.75s" repeatCount="indefinite"><mpath href="#motionRoute"/></animateMotion>
    </circle>
  </g>

  <rect x="296" y="330" width="608" height="40" rx="20" fill="#020617" fill-opacity=".58" stroke="#334155"/>
  <text x="600" y="355" class="eyebrow" style="fill:#cbd5e1;letter-spacing:.12em">ONE JOB · THREE AUDIENCES · FOUR MODEL CALLS · ZERO AUTO-SENDS</text>
</svg>
